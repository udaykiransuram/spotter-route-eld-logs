[project]
name = "spotter-route-eld-api"
version = "0.1.0"
description = "HOS-aware truck route planning and daily ELD log API."
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django==6.0.8",
    "djangorestframework==3.16.1",
    "django-cors-headers==4.9.0",
    "gunicorn==25.3.0",
    "httpx==0.28.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
